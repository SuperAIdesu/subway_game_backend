[project]
name = "subway-game-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SuperAIdesu", email = "tjx10011@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
subway-game-backend = "subway_game_backend:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
